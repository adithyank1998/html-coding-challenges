<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 21 — Custom Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 80px;
    gap: 24px;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: #1a1a1a;
    text-align: center;
  }

  .sub {
    text-align: center;
    font-size: 14px;
    color: #999;
    margin-top: 4px;
  }

  /* ══════════════════════════════
     PLAYER
  ══════════════════════════════ */
  .player {
    position: relative;
    width: 100%;
    max-width: 760px;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 16px 50px rgba(0,0,0,0.25);
    aspect-ratio: 16 / 9;
  }

  video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    cursor: pointer;
  }

  /* ── Center play button overlay ── */
  .center-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 76px; height: 76px;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }

  .player.playing .center-play {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.3);
  }

  .player:not(.playing) .center-play {
    opacity: 1;
  }

  /* ── Top-right badges ── */
  .top-bar {
    position: absolute;
    top: 16px; left: 16px; right: 16px;
    display: flex;
    justify-content: space-between;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .player:hover .top-bar,
  .player:not(.playing) .top-bar { opacity: 1; }

  .badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    background: rgba(0,0,0,0.4);
    padding: 5px 12px;
    border-radius: 100px;
    backdrop-filter: blur(4px);
  }

  /* ══════════════════════════════
     CONTROLS BAR
  ══════════════════════════════ */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 36px 16px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s, transform 0.3s;
    z-index: 5;
  }

  .player:hover .controls,
  .player:not(.playing) .controls,
  .player.show-controls .controls {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Progress bar ── */
  .progress-wrap {
    position: relative;
    height: 5px;
    background: rgba(255,255,255,0.25);
    border-radius: 100px;
    margin-bottom: 14px;
    cursor: pointer;
  }

  .progress-wrap:hover { height: 7px; }

  .progress-buffer {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.35);
    border-radius: 100px;
    width: 0%;
  }

  .progress-fill {
    position: absolute;
    inset: 0;
    background: #020208;
    border-radius: 100px;
    width: 0%;
    pointer-events: none;
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #04040a;
    transform: translate(-50%, -50%);
    left: 0%;
    box-shadow: 0 0 0 4px rgba(99,102,241,0.25);
    pointer-events: none;
    transition: opacity 0.15s;
    opacity: 0;
  }

  .progress-wrap:hover .progress-thumb { opacity: 1; }

  /* ── Bottom row buttons ── */
  .bottom-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s, transform 0.15s;
    opacity: 0.9;
  }

  .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }

  .time-display {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    font-variant-numeric: tabular-nums;
    min-width: 90px;
  }

  .spacer { flex: 1; }

  /* ── Volume ── */
  .volume-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .volume-slider {
    width: 70px;
    height: 4px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.3);
    border-radius: 100px;
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  .volume-slider::-moz-range-thumb {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
  }

  /* ── Speed menu ── */
  .speed-wrap { position: relative; }

  .speed-btn {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 100px;
    padding: 5px 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .speed-btn:hover { background: rgba(255,255,255,0.22); }

  .speed-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: rgba(20,20,20,0.95);
    border-radius: 10px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 70px;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }

  .speed-menu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }

  .speed-option {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #ccc;
    background: none;
    border: none;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }

  .speed-option:hover { background: rgba(255,255,255,0.08); }
  .speed-option.active { color: #818cf8; font-weight: 700; }

  /* ── Day badge ── */
  .day-badge {
    position: fixed;
    bottom: 20px; right: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #aaa;
    background: #fff;
    border: 1px solid #eee;
    padding: 6px 14px;
    border-radius: 20px;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .time-display { min-width: 70px; font-size: 11px; }
    .volume-slider { width: 50px; }
    .bottom-row { gap: 8px; }
    .badge { display: none; }
  }
</style>
</head>
<body>

<div>
  <h1>Custom Video Player</h1>
  <p class="sub">Built from scratch with the HTML5 Video API</p>
</div>

<div class="player" id="player">

  <video id="video" loop muted playsinline
    src="https://www.pexels.com/video/snowdon-mountain-trail-14409809/">
  </video>

  <!-- Top badges -->
  <div class="top-bar">
    <span class="badge">HD</span>
    <span class="badge" id="speedBadge" style="display:none">1.0×</span>
  </div>

  <!-- Center play -->
  <div class="center-play" id="centerPlay">▶</div>

  <!-- Controls -->
  <div class="controls">

    <!-- Progress bar -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-buffer" id="progressBuffer"></div>
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>

    <!-- Bottom row -->
    <div class="bottom-row">
      <button class="ctrl-btn" id="playBtn" title="Play/Pause">▶</button>
      <button class="ctrl-btn" id="rewindBtn" title="Rewind 10s">⏪</button>
      <button class="ctrl-btn" id="forwardBtn" title="Forward 10s">⏩</button>

      <span class="time-display" id="timeDisplay">0:00 / 0:00</span>

      <div class="spacer"></div>

      <div class="volume-group">
        <button class="ctrl-btn" id="muteBtn" title="Mute">🔇</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0">
      </div>

      <div class="speed-wrap">
        <button class="speed-btn" id="speedBtn">1×</button>
        <div class="speed-menu" id="speedMenu">
          <button class="speed-option" data-speed="0.5">0.5×</button>
          <button class="speed-option" data-speed="0.75">0.75×</button>
          <button class="speed-option active" data-speed="1">1× Normal</button>
          <button class="speed-option" data-speed="1.5">1.5×</button>
          <button class="speed-option" data-speed="2">2×</button>
        </div>
      </div>

      <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
    </div>
  </div>
</div>

<div class="day-badge">Day 21 / 30</div>

<script>
  const video       = document.getElementById('video');
  const player      = document.getElementById('player');
  const playBtn     = document.getElementById('playBtn');
  const centerPlay  = document.getElementById('centerPlay');
  const rewindBtn   = document.getElementById('rewindBtn');
  const forwardBtn  = document.getElementById('forwardBtn');
  const muteBtn     = document.getElementById('muteBtn');
  const volumeSlider= document.getElementById('volumeSlider');
  const progressWrap   = document.getElementById('progressWrap');
  const progressFill   = document.getElementById('progressFill');
  const progressBuffer = document.getElementById('progressBuffer');
  const progressThumb  = document.getElementById('progressThumb');
  const timeDisplay = document.getElementById('timeDisplay');
  const speedBtn    = document.getElementById('speedBtn');
  const speedMenu   = document.getElementById('speedMenu');
  const speedBadge  = document.getElementById('speedBadge');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  /* ── Format seconds → m:ss ── */
  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  /* ── Play / Pause ── */
  function togglePlay() {
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  }

  video.addEventListener('play', () => {
    player.classList.add('playing');
    playBtn.textContent    = '⏸';
    centerPlay.textContent = '▶';
  });

  video.addEventListener('pause', () => {
    player.classList.remove('playing');
    playBtn.textContent = '▶';
  });

  playBtn.addEventListener('click', togglePlay);
  centerPlay.addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);

  /* ── Rewind / Forward ── */
  rewindBtn.addEventListener('click', () => {
    video.currentTime = Math.max(0, video.currentTime - 10);
  });

  forwardBtn.addEventListener('click', () => {
    video.currentTime = Math.min(video.duration, video.currentTime + 10);
  });

  /* ── Progress bar update ── */
  video.addEventListener('timeupdate', () => {
    const pct = (video.currentTime / video.duration) * 100;
    progressFill.style.width  = pct + '%';
    progressThumb.style.left  = pct + '%';
    timeDisplay.textContent   = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  });

  /* ── Buffered progress ── */
  video.addEventListener('progress', () => {
    if (video.buffered.length > 0) {
      const bufferedEnd = video.buffered.end(video.buffered.length - 1);
      const pct = (bufferedEnd / video.duration) * 100;
      progressBuffer.style.width = pct + '%';
    }
  });

  /* ── Click / drag progress bar to seek ── */
  let isDragging = false;

  function seek(e) {
    const rect = progressWrap.getBoundingClientRect();
    let pct = (e.clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    video.currentTime = pct * video.duration;
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
  }

  progressWrap.addEventListener('mousedown', e => {
    isDragging = true;
    seek(e);
  });

  document.addEventListener('mousemove', e => {
    if (isDragging) seek(e);
  });

  document.addEventListener('mouseup', () => { isDragging = false; });

  /* ── Volume ── */
  volumeSlider.addEventListener('input', () => {
    video.volume = volumeSlider.value;
    video.muted  = volumeSlider.value === '0';
    updateMuteIcon();
  });

  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) {
      video.volume = 0.5;
      volumeSlider.value = 0.5;
    }
    updateMuteIcon();
  });

  function updateMuteIcon() {
    if (video.muted || video.volume === 0) {
      muteBtn.textContent = '🔇';
    } else if (video.volume < 0.5) {
      muteBtn.textContent = '🔉';
    } else {
      muteBtn.textContent = '🔊';
    }
  }

  // Init muted state
  video.muted = true;
  volumeSlider.value = 0;
  updateMuteIcon();

  /* ── Playback speed ── */
  speedBtn.addEventListener('click', () => {
    speedMenu.classList.toggle('open');
  });

  document.querySelectorAll('.speed-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const speed = parseFloat(opt.dataset.speed);
      video.playbackRate = speed;

      document.querySelectorAll('.speed-option').forEach(o => o.classList.remove('active'));
      opt.classList.add('active');

      speedBtn.textContent = speed + '×';
      speedMenu.classList.remove('open');

      // Show speed badge if not 1x
      if (speed !== 1) {
        speedBadge.style.display = 'inline-block';
        speedBadge.textContent   = speed.toFixed(speed % 1 === 0 ? 0 : 2) + '×';
      } else {
        speedBadge.style.display = 'none';
      }
    });
  });

  // Close speed menu when clicking elsewhere
  document.addEventListener('click', e => {
    if (!e.target.closest('.speed-wrap')) {
      speedMenu.classList.remove('open');
    }
  });

  /* ── Fullscreen ── */
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      player.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    switch (e.code) {
      case 'Space':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowRight':
        video.currentTime = Math.min(video.duration, video.currentTime + 5);
        break;
      case 'ArrowLeft':
        video.currentTime = Math.max(0, video.currentTime - 5);
        break;
      case 'ArrowUp':
        e.preventDefault();
        video.volume = Math.min(1, video.volume + 0.1);
        volumeSlider.value = video.volume;
        video.muted = false;
        updateMuteIcon();
        break;
      case 'ArrowDown':
        e.preventDefault();
        video.volume = Math.max(0, video.volume - 0.1);
        volumeSlider.value = video.volume;
        updateMuteIcon();
        break;
      case 'KeyM':
        muteBtn.click();
        break;
      case 'KeyF':
        fullscreenBtn.click();
        break;
    }
  });

  /* ── Loaded metadata → set initial duration ── */
  video.addEventListener('loadedmetadata', () => {
    timeDisplay.textContent = `0:00 / ${formatTime(video.duration)}`;
  });
</script>
</body>
</html>
